worker_processes auto;

events {
    worker_connections 4096;
}

http {
    upstream api_backend {
        server api1:8080 max_fails=2 fail_timeout=5s;
        server api2:8080 max_fails=2 fail_timeout=5s;
        server api3:8080 max_fails=2 fail_timeout=5s;
        keepalive 64;
    }

    log_format upstream_log '$remote_addr - [$time_local] "$request" $status -> $upstream_addr';
    access_log /dev/stdout upstream_log;

    server {
        listen 80;

        location / {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_connect_timeout 500ms;
            proxy_read_timeout 10s;
        }
    }
}
